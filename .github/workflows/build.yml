name: Android CI Signed & Release

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Invia APK a Telegram'
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

jobs:
  build-signed:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:

      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------
      # JDK
      # -----------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # -----------------------------
      # GO
      # -----------------------------
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      # ---------------------------------------------------------
      # CACHE Go modules (velocizza scaricamenti moduli)
      # ---------------------------------------------------------
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-mod-${{ hashFiles('rclone/go.sum') }}
          restore-keys: |
            go-mod-

      # ---------------------------------------------------------
      # CACHE Go build cache (velocizza compilazioni)
      # ---------------------------------------------------------
      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ hashFiles('rclone/go.sum') }}
          restore-keys: |
            go-build-

      # -----------------------------
      # ANDROID NDK
      # -----------------------------
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      # -----------------------------
      # KEYSTORE
      # -----------------------------
      - name: Decode Keystore
        if: ${{ env.APP_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p app
          echo "$APP_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # -----------------------------
      # BUILD AND SIGN
      # -----------------------------
      - name: Build Signed Release APK (ALL SPLITS)
        env:
          CMD_RELEASE_KEYSTORE: release.keystore
          CMD_RELEASE_KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASSWORD }}
          CMD_RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CMD_RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          echo "Eseguo build completa con TUTTE le architetture..."
          ./gradlew assembleOssRelease --stacktrace

      ###########################################################
      # ARTIFACT SEPARATI
      ###########################################################

      - name: Upload APK arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-arm64-v8a
          path: app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-armeabi-v7a
          path: app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK x86
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-x86
          path: app/build/outputs/apk/oss/release/*-oss-x86-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK x86_64
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-x86_64
          path: app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload APK universal
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-oss-universal
          path: app/build/outputs/apk/oss/release/*-oss-universal-release.apk
          retention-days: 90
          if-no-files-found: warn

      ###########################################################
      # RELEASE SU TAG
      ###########################################################
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
            app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk
            app/build/outputs/apk/oss/release/*-oss-x86-release.apk
            app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk
            app/build/outputs/apk/oss/release/*-oss-universal-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ###########################################################
      # TELEGRAM (OPZIONALE)
      ###########################################################
      - name: Send to Telegram
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *Nuova Build Disponibile*
            Repo: ${{ github.repository }}
            Branch/Tag: ${{ github.ref_name }}
            I file APK sono allegati qui sotto.
          document: |
            app/build/outputs/apk/oss/release/*-oss-arm64-v8a-release.apk
            app/build/outputs/apk/oss/release/*-oss-armeabi-v7a-release.apk
            app/build/outputs/apk/oss/release/*-oss-x86-release.apk
            app/build/outputs/apk/oss/release/*-oss-x86_64-release.apk
            app/build/outputs/apk/oss/release/*-oss-universal-release.apk
